[package]
name = "nebula"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "nebula"

[lib]
name = "nebula"
path = "src/lib.rs"

[[bin]]
name = "nebula"
path = "src/main.rs"

# The same GUI with `windows_subsystem = "windows"`: no console window, so a
# double-click does not open a terminal behind the app.
[[bin]]
name = "nebula-gui"
path = "src/bin/nebula-gui.rs"

[dependencies]
nebula-core = { path = "../nebula-core", version = "1.0.0" }
clap = { version = "4.6.6", features = ["derive"] }
log.workspace = true
env_logger = "0.11.11"
serde.workspace = true
serde_json.workspace = true
slint = { version = "=1.17.1", default-features = false, features = ["std", "backend-default", "renderer-software", "accessibility", "compat-1-2"] }

[build-dependencies]
slint-build = "=1.17.1"

[dev-dependencies]
# Already in Cargo.lock through nebula-core; no new package.
tempfile = "3.27.0"
