[workspace]
resolver = "3"
members = ["crates/nebula-core", "crates/nebula"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"
repository = "https://github.com/dscalzi/Nebula"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
log = "0.4.34"
url = "2.5.8"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
