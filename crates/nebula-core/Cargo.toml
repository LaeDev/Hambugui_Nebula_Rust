[package]
name = "nebula-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
url.workspace = true
schemars = "1.2.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls"] } # native-tls like the launcher: no NASM/CMake needed on Windows CI
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
toml = "1.1.5"
globset = "0.4.20"
md-5 = "0.11.0"
sha2 = "0.11.0"
sha1 = "0.11.0"
hex = "0.4.3"
dotenvy = "0.15.7"
tempfile = "3.27.0"
# Icon decoding for the mod catalog. Slint already builds this exact crate, so
# cargo unifies the two and no new package enters Cargo.lock. The features are
# the three formats the providers actually serve (webp on Modrinth, png/jpeg on
# CurseForge); never enable `slint/image-default-formats`, which would pull
# rav1e into the normal graph (D5, R8).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# The signature on distribution.json. The same crate and version the Hambugui
# launcher verifies with (`verify_strict`), so both sides run one algorithm.
ed25519-dalek = "3.0.0"
# The OS random source for `nebula keygen`; already in Cargo.lock.
getrandom = "0.4.3"
# Wipes the seed's hex text after use; ed25519-dalek already depends on it.
zeroize = "1.9.0"

[dev-dependencies]
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Same crate and features as above, so the icon tests can encode the PNG and
# JPEG they feed the decoder. No new package enters Cargo.lock.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
